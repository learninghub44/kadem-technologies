<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="AI and automation illustration">
  <defs>
    <linearGradient id="ai-head" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B4B8F"/>
      <stop offset="1" stop-color="#123564"/>
    </linearGradient>
  </defs>
  <!-- soft backdrop -->
  <circle cx="200" cy="150" r="115" fill="#E9F0FA"/>

  <!-- gear ring -->
  <g fill="none" stroke="#1B4B8F" stroke-width="2" opacity="0.35">
    <circle cx="200" cy="150" r="88"/>
  </g>
  <g fill="#E08A34">
    <circle cx="200" cy="62" r="6"/>
    <circle cx="288" cy="150" r="6"/>
    <circle cx="200" cy="238" r="6"/>
    <circle cx="112" cy="150" r="6"/>
    <circle cx="262" cy="88" r="5"/>
    <circle cx="262" cy="212" r="5"/>
    <circle cx="138" cy="88" r="5"/>
    <circle cx="138" cy="212" r="5"/>
  </g>

  <!-- chip / brain module -->
  <rect x="150" y="110" width="100" height="80" rx="14" fill="url(#ai-head)"/>
  <rect x="168" y="128" width="64" height="44" rx="8" fill="rgba(255,255,255,0.16)"/>
  <circle cx="184" cy="150" r="6" fill="#3ccbf4"/>
  <circle cx="216" cy="150" r="6" fill="#E08A34"/>
  <path d="M178 162h44" stroke="rgba(255,255,255,0.55)" stroke-width="3" stroke-linecap="round"/>

  <!-- connector leads -->
  <g stroke="#1B4B8F" stroke-width="2.5" stroke-linecap="round">
    <path d="M150 130h-20"/>
    <path d="M150 170h-20"/>
    <path d="M250 130h20"/>
    <path d="M250 170h20"/>
    <path d="M180 110v-18"/>
    <path d="M220 110v-18"/>
    <path d="M180 190v18"/>
    <path d="M220 190v18"/>
  </g>
  <g fill="#123564">
    <circle cx="126" cy="130" r="4"/>
    <circle cx="126" cy="170" r="4"/>
    <circle cx="274" cy="130" r="4"/>
    <circle cx="274" cy="170" r="4"/>
    <circle cx="180" cy="88" r="4"/>
    <circle cx="220" cy="88" r="4"/>
    <circle cx="180" cy="212" r="4"/>
    <circle cx="220" cy="212" r="4"/>
  </g>
</svg>
